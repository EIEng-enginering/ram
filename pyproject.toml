[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rammodel"
version = "0.3.0.dev1"
requires-python = ">=3.12"
description = "RAM and production availability modelling foundation"
dependencies = ["numpy>=1.26", "scipy>=1.11", "PySide6>=6.7", "openpyxl>=3.1", "python-docx>=1.1", "reportlab>=4", "matplotlib>=3.8", "pypdf>=4"]

[project.scripts]
rammodel = "rammodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rammodel = ["*.sql"]
